# 声明式工具配置：新增工具 = 实现工具类 + 在此登记，主流程零改动。
# enabled: false 的工具不会被调度；执行型工具在沙箱就绪前必须保持 disabled。
tools:
  diff-stat:
    enabled: true
    description: 统计 diff 的文件与行变更数（纯文本计算，不执行任何仓库代码）
    file_types: ["*"]
    timeout_s: 5
  typecheck:
    enabled: false
    description: 运行类型检查（执行型工具；沙箱就绪前禁用，Phase 4/9 处理）
    file_types: ["*.py"]
    timeout_s: 120
