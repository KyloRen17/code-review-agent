model:
  provider: mock          # mock | openai
  name: mock-reviewer-v1
  temperature: 0.2
  max_output_tokens: 2048
  # 真实模型示例（凭证只从环境变量读取，绝不写入本文件）：
  # provider: openai
  # name: gpt-4o-mini
  # base_url: https://api.openai.com/v1    # 任意 OpenAI 兼容服务
  # api_key_env: OPENAI_API_KEY

budget:
  currency: CNY
  limit: 10.0             # 单个 MR/PR 的预算上限；预算闸门在 Phase 7 启用

publishing:
  mode: dry_run           # dry_run | github | gitlab；远程写入需显式 --publish（Phase 10）

storage:
  db: runs/cra.sqlite
  report_dir: runs

limits:
  max_diff_bytes: 5242880     # 5 MiB，超过则拒绝处理（Phase 2 提供更精细的分块策略）
  max_work_unit_bytes: 65536  # 单个工作单元（hunk）超过此大小则跳过并记录
